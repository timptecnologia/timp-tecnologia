<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><title>Captura</title><style>html,body{margin:0;background:#07090C}</style></helmet>
<iframe id="cap" src="{{ src }}" title="captura" style="display:block;border:0;width:{{ w }};height:{{ h }}"></iframe>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const q = new URLSearchParams(location.search);
    const w = q.get('w') || '390', h = q.get('h') || '844';
    return { w: w + 'px', h: h + 'px', src: (q.get('page') || 'Home.dc.html') + '?' + (q.get('q') || '') };
  }
}
</script>
</body>
</html>
