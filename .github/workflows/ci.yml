name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Testes (unitários + RLS/IDOR em Postgres/PGlite)
        run: npm test
      - name: Build
        run: npm run build
      - name: Auditoria de dependências
        run: npm run security:audit
      - name: Secret scan (projeto)
        run: npm run security:secrets
      - name: Secret scan (histórico Git)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Integridade do design-reference
        run: npm run check:design-reference
